name: Process voter roll PDFs

on:
  push:
    branches: [main]
    paths:
      - "pdfs/**.pdf"
      - "config.yml"
      # NOTE: scripts/**.py is intentionally NOT here. Editing the OCR
      # script itself no longer auto-triggers a run against the full PDF
      # (which could take 15-20+ minutes and can't be cheaply cancelled
      # mid-way without leaving a partial commit). After editing a script,
      # go to the Actions tab and use "Run workflow" manually instead --
      # you can test on just a couple of pages first (see inputs below).
  workflow_dispatch:
    inputs:
      force_ocr:
        description: "Force OCR to re-run even if cached (use after editing voter_roll_ocr.py)"
        type: boolean
        default: false
      max_pages:
        description: "Optional: cap every entry to at most N pages, for a quick test run (leave blank for full run)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  ocr-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (poppler + tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Install Python dependencies
        run: pip install opencv-python-headless numpy pyyaml

      - name: Cache Tesseract best-accuracy language data
        id: cache-tessdata
        uses: actions/cache@v4
        with:
          path: tessdata
          key: tessdata-best-hin-eng-v1

      - name: Download Tesseract best (LSTM) Hindi + English models
        if: steps.cache-tessdata.outputs.cache-hit != 'true'
        run: |
          mkdir -p tessdata
          curl -sL -o tessdata/hin.traineddata \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/hin.traineddata
          curl -sL -o tessdata/eng.traineddata \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/eng.traineddata

      - name: Run OCR pipeline (skips already-processed PDFs)
        env:
          TESSDATA_PREFIX: ${{ github.workspace }}/tessdata
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force_ocr }}" = "true" ]; then
            ARGS="$ARGS --force-ocr"
          fi
          if [ -n "${{ github.event.inputs.max_pages }}" ]; then
            ARGS="$ARGS --max-pages ${{ github.event.inputs.max_pages }}"
          fi
          echo "Running: python3 run_pipeline.py $ARGS"
          python3 run_pipeline.py $ARGS

      - name: Commit generated dashboards back to repo
        run: |
          git config user.name "voter-roll-bot"
          git config user.email "actions@github.com"
          git add docs/
          git reset docs/_test/ 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto-update dashboards [skip ci]"
          git push

      - name: Upload docs/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: ocr-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
